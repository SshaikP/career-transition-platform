version: "3.8"

services:

  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: careerdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - skillorbit-network

  backend:
    build: ./user-service
    container_name: skillorbit-backend
    depends_on:
      - postgres-db
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres-db:5432/careerdb
      DB_USERNAME: admin
      DB_PASSWORD: admin123
    networks:
      - skillorbit-network

  frontend:
    build: ./frontend
    container_name: skillorbit-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - skillorbit-network

networks:
  skillorbit-network:

volumes:
  postgres-data: