version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: careerdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      
  backend:
    image: skillorbit-backend:latest
    container_name: skillorbit-backend
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    image: skillorbit-frontend:latest
    container_name: skillorbit-frontend
    ports:
      - "3000:80"

volumes:
  postgres-data: